openapi: 3.1.0
info:
  title: Bank Credit and Card Management Microservice (credit-service)
  description: Reactive Open-API Contract managing traditional Credit products and revolving Credit Card lines with instantaneous limit validation.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: API Gateway Entry Point
  - url: http://localhost:8083
    description: Direct Credit Service Instance
paths:
  /api/credits:
    post:
      summary: Issue a new traditional credit line
      description: Provisions a Personal or Business Credit contract. Blocks execution if a personal client attempts to clone or secure more than one credit.
      operationId: createCredit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credit'
      responses:
        '201':
          description: Financial credit entity provisioned and logged successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credit'
        '400':
          description: Business policy deviation or invalid parameters supplied.

  /api/credits/cards:
    post:
      summary: Provision a new revolving credit card
      description: Issues a personal or enterprise credit card product initialized with default billing terms and limit matching parameters.
      operationId: createCreditCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCard'
      responses:
        '201':
          description: Revolving credit card issued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCard'

  /api/credits/customer/{customerId}:
    get:
      summary: Retrieve all active credits for a Customer ID
      description: Streams a non-blocking collection matching every traditional credit account linked to the targeted identifier.
      operationId: getCreditsByCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          description: Target customer hexadecimal unique identifier string
          schema:
            type: string
      responses:
        '200':
          description: Continuous array stream of traditional credits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credit'

  /api/credits/cards/number/{cardNumber}:
    get:
      summary: Find a credit card by its primary card number
      operationId: getCardByNumber
      parameters:
        - name: cardNumber
          in: path
          required: true
          description: The 16-digit alphanumeric card number identifier
          schema:
            type: string
      responses:
        '200':
          description: Credit card account details fetched accurately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCard'
        '404':
          description: Target credit card number could not be found.

  /api/credits/payment:
    post:
      summary: Process an installment payment toward a traditional credit
      description: Amortizes outstanding debt balances on an active traditional loan account.
      operationId: executeCreditPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - creditNumber
                - amount
                - description
              properties:
                creditNumber:
                  type: string
                  example: CRD-A2B3C4D5
                amount:
                  type: number
                  format: double
                  example: 500.00
                description:
                  type: string
                  example: Regular monthly payment
      responses:
        '200':
          description: Balance adjusted and transactional invoice record generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransaction'
        '404':
          description: Targeted credit reference missing from system records.

  /api/credits/cards/operation:
    post:
      summary: Post a credit card operation (Consumption or Payment)
      description: Validates current liquidity threshold on consumption sweeps. Deducts or replenishes revolving balances immediately.
      operationId: executeCardOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cardNumber
                - type
                - amount
                - description
              properties:
                cardNumber:
                  type: string
                  example: "4557111122223333"
                type:
                  type: string
                  enum: [CARD_CONSUMPTION, CARD_PAYMENT]
                  example: CARD_CONSUMPTION
                amount:
                  type: number
                  format: double
                  example: 120.75
                description:
                  type: string
                  example: POS retail terminal checkout
      responses:
        '200':
          description: Line capacity adjusted and audit verification entry returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransaction'
        '400':
          description: Balance allocation overflow or invalid transactional direction.

components:
  schemas:
    Credit:
      type: object
      required:
        - customerId
        - customerType
        - type
        - amountGranted
        - balanceOwed
        - currency
      properties:
        id:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c201
        creditNumber:
          type: string
          example: CRD-A2B3C4D5
        customerId:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c001
        customerType:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          example: PERSONAL
        type:
          type: string
          enum: [PERSONAL_CREDIT, BUSINESS_CREDIT]
          example: PERSONAL_CREDIT
        status:
          type: string
          example: ACTIVE
        amountGranted:
          type: number
          format: double
          example: 5000.00
        balanceOwed:
          type: number
          format: double
          example: 3200.00
        currency:
          type: string
          example: PEN
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreditCard:
      type: object
      required:
        - customerId
        - customerType
        - creditLimit
        - currency
      properties:
        id:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c203
        cardNumber:
          type: string
          example: "4557111122223333"
        customerId:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c001
        customerType:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          example: PERSONAL
        status:
          type: string
          example: ACTIVE
        creditLimit:
          type: number
          format: double
          example: 3000.00
        availableBalance:
          type: number
          format: double
          example: 2150.00
        balanceOwed:
          type: number
          format: double
          example: 850.00
        currency:
          type: string
          example: PEN
        expirationDate:
          type: string
          example: "11/31"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreditTransaction:
      type: object
      properties:
        id:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c204
        transactionNumber:
          type: string
          example: TXN-CRD-20260315-089
        productType:
          type: string
          enum: [CREDIT, CREDIT_CARD]
          example: CREDIT_CARD
        productIdentifier:
          type: string
          example: "4557111122223333"
        type:
          type: string
          enum: [CREDIT_PAYMENT, CARD_CONSUMPTION, CARD_PAYMENT]
          example: CARD_CONSUMPTION
        amount:
          type: number
          format: double
          example: 150.00
        description:
          type: string
          example: E-commerce charge validation
        timestamp:
          type: string
          format: date-time
