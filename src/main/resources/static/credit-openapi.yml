openapi: 3.1.0
info:
  title: Credit & Credit Card Microservice (credit-service)
  description: Reactive Open-API Contract managing Personal/Business Credits and Credit Cards. Validates customers locally via Kafka replicas and publishes CreditCardCreatedEvent (to unlock VIP/PYME accounts) and CreditTransactionEvent (for ledger reporting).
  version: 2.0.0
servers:
  - url: http://localhost:8080
    description: API Gateway Entry Point
  - url: http://localhost:8083
    description: Direct Credit Service Instance

paths:
  /api/credits:
    post:
      summary: Grant a new Personal or Business Credit
      description: Validates customer status via local Kafka replica (no bank account required). Enforces the single-credit rule for PERSONAL customers.
      operationId: createCredit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credit'
            examples:
              personalCredit:
                summary: Personal Loan Request
                value:
                  customerId: 65f1a2b3c4d5e6f7a8b9c001
                  amountGranted: 5000.00
                  currency: PEN
                  interestRate: 12.5
                  installments: 12
      responses:
        '201':
          description: Credit granted and provisioned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credit'
        '400':
          description: Customer not found/inactive or Personal customer already holds an active credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/credits/cards:
    post:
      summary: Issue a new Credit Card (Unlocks VIP & PYME accounts)
      description: Provisions a Credit Card and publishes a CreditCardCreatedEvent to Kafka so account-service updates its local replica and allows VIP/PYME account openings.
      operationId: createCreditCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCard'
            examples:
              vipCreditCard:
                summary: Credit Card for VIP/PYME Eligibility
                value:
                  customerId: 65f1a2b3c4d5e6f7a8b9c001
                  creditLimit: 8000.00
                  currency: PEN
      responses:
        '201':
          description: Credit card issued and synchronization event published to Kafka.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCard'
        '400':
          description: Customer not registered or inactive in local replica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/credits/customer/{customerId}:
    get:
      summary: Retrieve all credits belonging to a Customer ID
      operationId: getCreditsByCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          description: Customer hexadecimal identifier
          schema:
            type: string
            example: 65f1a2b3c4d5e6f7a8b9c001
      responses:
        '200':
          description: Reactive stream of customer credits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credit'

  /api/credits/cards/number/{cardNumber}:
    get:
      summary: Find a Credit Card by its 16-digit card number
      operationId: getCardByNumber
      parameters:
        - name: cardNumber
          in: path
          required: true
          description: 16-digit Credit Card number
          schema:
            type: string
            example: "4557111122223333"
      responses:
        '200':
          description: Credit card details retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCard'
        '404':
          description: Credit card number does not exist.

  /api/credits/payment:
    post:
      summary: Execute a payment towards a Credit loan
      description: Reduces the owed balance of a credit and publishes a CreditTransactionEvent to Kafka for transaction-service auditing.
      operationId: executeCreditPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditPaymentRequest'
      responses:
        '200':
          description: Credit payment processed and receipt generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransaction'
        '400':
          description: Credit not found or invalid payment payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/credits/cards/operation:
    post:
      summary: Execute a consumption or payment on a Credit Card
      description: Processes CARD_CONSUMPTION (deducts available credit line) or CARD_PAYMENT (restores credit line) and emits an event to Kafka so it appears in the card's last 10 movements report.
      operationId: executeCardOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardOperationRequest'
      responses:
        '200':
          description: Credit card operation processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransaction'
        '400':
          description: Insufficient credit limit, card not found, or invalid operation type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Credit:
      type: object
      required:
        - customerId
        - amountGranted
        - currency
      properties:
        id:
          type: string
          example: 6736b1a2c3d4e5f6a7b80101
        creditNumber:
          type: string
          example: CRD-11223344
        customerId:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c001
        customerType:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          example: PERSONAL
        type:
          type: string
          enum: [PERSONAL_CREDIT, BUSINESS_CREDIT]
          example: PERSONAL_CREDIT
        amountGranted:
          type: number
          format: double
          example: 5000.00
        balanceOwed:
          type: number
          format: double
          example: 4000.00
        currency:
          type: string
          example: PEN
        interestRate:
          type: number
          format: double
          example: 12.5
        installments:
          type: integer
          example: 12
        status:
          type: string
          enum: [ACTIVE, PAID, OVERDUE]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreditCard:
      type: object
      required:
        - customerId
        - creditLimit
        - currency
      properties:
        id:
          type: string
          example: 6736b1a2c3d4e5f6a7b80202
        cardNumber:
          type: string
          example: "4557111122223333"
        customerId:
          type: string
          example: 65f1a2b3c4d5e6f7a8b9c001
        customerType:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          example: PERSONAL
        creditLimit:
          type: number
          format: double
          example: 8000.00
        availableBalance:
          type: number
          format: double
          example: 7550.00
        balanceOwed:
          type: number
          format: double
          example: 450.00
        currency:
          type: string
          example: PEN
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
          example: ACTIVE
        expirationDate:
          type: string
          example: "11/31"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreditPaymentRequest:
      type: object
      required:
        - creditNumber
        - amount
      properties:
        creditNumber:
          type: string
          example: CRD-11223344
        amount:
          type: number
          format: double
          example: 1000.00
        description:
          type: string
          example: Monthly installment payment #1

    CardOperationRequest:
      type: object
      required:
        - cardNumber
        - type
        - amount
      properties:
        cardNumber:
          type: string
          example: "4557111122223333"
        type:
          type: string
          enum: [CARD_CONSUMPTION, CARD_PAYMENT]
          example: CARD_CONSUMPTION
        amount:
          type: number
          format: double
          example: 450.00
        description:
          type: string
          example: Airline tickets purchase

    CreditTransaction:
      type: object
      properties:
        id:
          type: string
        transactionNumber:
          type: string
          example: TXN-CC-99887766
        productType:
          type: string
          enum: [CREDIT, CREDIT_CARD]
          example: CREDIT_CARD
        productIdentifier:
          type: string
          example: "4557111122223333"
        type:
          type: string
          enum: [CREDIT_PAYMENT, CARD_CONSUMPTION, CARD_PAYMENT]
          example: CARD_CONSUMPTION
        amount:
          type: number
          format: double
          example: 450.00
        description:
          type: string
          example: Airline tickets purchase
        timestamp:
          type: string
          format: date-time
    
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Customer not found or inactive.
